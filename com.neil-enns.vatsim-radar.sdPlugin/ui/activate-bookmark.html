<!doctype html>
<html>
  <head lang="en">
    <title>Activate Bookmark Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
  </head>

  <body>
    <sdpi-item label="Bookmark">
      <sdpi-select
        setting="bookmark"
        datasource="get-bookmarks"
        placeholder="Select a bookmark"
        loading="Retrieving bookmarks..."
        hot-reload
      >
      </sdpi-select>
    </sdpi-item>
  </body>
</html>
